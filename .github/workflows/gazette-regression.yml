name: Gazette regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gazette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_weekly_gazette.py -v
      - run: python -m unittest discover -s tests -p test_dude_commentary.py -v
      - run: python -m unittest discover -s tests -p test_bowler_sprites.py -v
      - run: python -m unittest discover -s tests -p test_ball_sprites.py -v
      - run: python -m unittest discover -s tests -p test_scene_renderer.py -v
      - run: python -m unittest discover -s tests -p test_scene_scale_tuning.py -v
      - run: python -m unittest discover -s tests -p test_asset_path_compatibility.py -v
      - run: python -m unittest discover -s tests -p test_match_controls.py -v
      - run: python -m unittest discover -s tests -p test_game_completion.py -v
      - run: python -m unittest discover -s tests -p test_shot_animation.py -v
      - run: python -m unittest discover -s tests -p test_spare_ball_visibility.py -v
      - run: python -m unittest discover -s tests -p test_second_ball_playback.py -v
      - run: python -m unittest discover -s tests -p test_wide_broadcast.py -v
      - run: python -m unittest discover -s tests -p test_scoreboard_identity.py -v
      - run: python -m compileall -q services cogs storage ui
